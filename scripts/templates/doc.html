<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="theme-color" content="#eef0f3">
    {{ROBOTS}}
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/workspace.css">
  </head>
  <body class="ws-body">
    <a class="ws-skip" href="#ws-main">跳到主要内容</a>

    <header class="ws-topbar">
      <div class="ws-topbar-inner">
        <a class="ws-brand" href="./index.html" aria-label="项目档案首页">
          <span class="ws-logo" aria-hidden="true">W</span>
          WorkSpace
        </a>
        <nav class="ws-topnav" aria-label="站点导航">
          <a href="./index.html" aria-current="page">项目档案</a>
          <a href="../devkit/">工具箱</a>
          <a href="../">返回入口</a>
        </nav>
      </div>
    </header>

    <div class="ws-layout">
      <aside class="ws-rail" aria-label="项目与目录导航">
        <div class="ws-rail-head">
          <span>项目</span>
          <em>2</em>
        </div>
        <ul class="ws-project-list">
{{PROJECTS}}
        </ul>

        <nav class="ws-toc" aria-label="本文目录">
          <p>本文目录</p>
          <ol>
{{TOC}}
          </ol>
        </nav>
      </aside>

      <main id="ws-main" class="ws-main">
        <header class="ws-page-head">
          <p class="ws-breadcrumb">
            <a href="./index.html">项目档案</a>
            <span>/</span>
            <span>{{BREADCRUMB}}</span>
          </p>
          <p class="ws-eyebrow">{{EYEBROW}}</p>
          <div class="ws-title-row">
            <h1>{{H1}}</h1>
            <span class="ws-title-code">{{H1_NOTE}}</span>
          </div>
          <p class="ws-tagline">{{TAGLINE}}</p>
          <ul class="ws-meta" aria-label="项目概况">
{{META_ITEMS}}
          </ul>
        </header>

{{CONTENT}}
      </main>
    </div>

    <footer class="ws-footer">
      <p>WorkSpace · 项目档案</p>
      <p>Markdown 源文件：<a href="./content/{{SOURCE_NAME}}">{{SOURCE_NAME}}</a></p>
      <p><a href="../">返回入口</a> · <a href="../devkit/">DevKit 工具箱</a></p>
    </footer>
  </body>
</html>
